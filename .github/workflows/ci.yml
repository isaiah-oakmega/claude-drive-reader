name: CI

on:
  push:
  pull_request:

# 同一個分支有新的 push 時，取消還在跑或排隊的舊 run：只有最新的 commit 需要結果，
# 也避免 macOS runner 不足時舊 run 佔著排隊位置
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }} on ${{ matrix.os }}
    strategy:
      # 一個平台失敗不取消其他平台，才能一次看到所有平台的結果（風險 #9）
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: [backend, plugin]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      # setup-uv 沒有會跟著更新的主版本 tag（例如 v10），只能指定完整版本
      - uses: astral-sh/setup-uv@v10.3.3

      # --locked：lockfile 和 pyproject.toml 不一致就失敗，在我們這端擋下問題，
      # 驗收者電腦上的 .mcp.json 才能放心用 --frozen
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check dependency rules
        run: uv run lint-imports

  package:
    # 模擬驗收者安裝 plugin 之後的第一次啟動：沒有先 uv sync、不裝 dev 依賴，
    # 用和 .mcp.json 完全相同的指令啟動 MCP server 並完成握手
    name: plugin package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Start the MCP server the way .mcp.json does
        run: uv run --frozen --no-dev python scripts/mcp_handshake.py
