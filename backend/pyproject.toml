[project]
name = "token-broker"
version = "0.1.0"
description = "Stateless OAuth Token Broker for the Drive Reader Claude Code plugin"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "import-linter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/token_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 依賴規則由 import-linter 強制，見 docs/implementation-spec.md「Repo 形態」。
# 規則 5（backend 與 plugin 互不 import）由兩個獨立專案的結構保證，不需要寫成 contract。
[tool.importlinter]
root_package = "token_broker"

[[tool.importlinter.contracts]]
name = "Token Broker layers: api -> app -> infra -> domain"
type = "layers"
layers = [
    "token_broker.api",
    "token_broker.app",
    "token_broker.infra",
    "token_broker.domain",
]
